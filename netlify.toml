# Netlify deploy. Frontend je statičan; API lige je zaseban Worker (vidi niže).

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # `pnpm data` skida Natural Earth i GeoNames pri svakom buildu. SPEC §4 tako
  # i predviđa — podaci nisu u gitu jer su reproducibilni.
  NETLIFY_USE_PNPM = "true"

# Deep linkovi lige su klijentske rute: `/l/:code` i `/v/:token` moraju vratiti
# index.html, inače Netlify javi 404 prije nego aplikacija uopće krene. SPEC §7.2.
[[redirects]]
  from = "/l/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/v/*"
  to = "/index.html"
  status = 200

# API lige živi na Cloudflare Workersu (D1 je ondje), a klijent u produkciji zove
# `/api` na istom originu. Pravilo koje to spaja se NE PIŠE OVDJE: netlify.toml ne
# interpolira varijable okoline, pa bi adresa morala biti upisana rukom — a upravo
# je takvo pravilo, zakomentirano i bez adrese, značilo da prijava u ligu vraća
# 404 stranicu hostinga.
#
# Umjesto toga build emitira `_redirects` iz varijable ORBIS_API_URL, koju Netlify
# spaja s ovom datotekom. Da liga proradi:
#
#   1. cd worker && wrangler d1 create orbis-db     → upiši database_id u wrangler.toml
#   2. wrangler d1 migrations apply orbis-db --remote
#   3. wrangler deploy                              → ispiše adresu Workera
#   4. u Netlifyju postavi ORBIS_API_URL na tu adresu i pokreni redeploy
#
# Bez te varijable igra radi normalno, a liga jasno kaže da nije dostupna.

# Zaglavlja su u public/_headers — Netlify i Cloudflare Pages dijele isti format.
