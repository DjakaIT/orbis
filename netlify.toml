# Netlify deploy. Frontend je statičan, API lige je Netlifyjeva funkcija.

[build]
  command = "pnpm build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # `pnpm data` skida Natural Earth, GeoNames i zastave pri svakom buildu. SPEC §4
  # tako i predviđa — podaci nisu u gitu jer su reproducibilni.
  NETLIFY_USE_PNPM = "true"

# Deep linkovi lige su klijentske rute: `/l/:code` i `/v/:token` moraju vratiti
# index.html, inače Netlify javi 404 prije nego aplikacija uopće krene. SPEC §7.2.
[[redirects]]
  from = "/l/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/v/*"
  to = "/index.html"
  status = 200

# Za `/api/*` ovdje NEMA pravila i ne treba ga biti. Funkcija sama deklarira svoju
# putanju (`export const config = { path: '/api/*' }` u netlify/functions/api.mts),
# pa je API na istom originu kao i stranica — bez proxyja, bez CORS-a i bez ijedne
# adrese koja bi se morala upisati rukom.
#
# Prije je API bio Cloudflare Worker, a pravilo koje ga je spajalo stajalo je
# zakomentirano s placeholderom umjesto adrese. Posljedica je bila da je prijava u
# ligu vraćala 404 stranicu hostinga. Vidi DECISIONS.md.

# Zaglavlja su u public/_headers.
