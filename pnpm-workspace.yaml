# Aplikacija živi u korijenu repozitorija, worker je zaseban paket. SPEC §3.
packages:
  - 'worker'

# esbuild treba postinstall (tsx ga koristi); msgpackr-extract je opcionalni ubrzivač
# mapshaperovog cachea; workerd je Cloudflareov runtime koji wrangler mora podići.
# better-sqlite3 je mapshaperova neobavezna SQL grana, a sharp wranglerov obrađivač
# slika — ni jedno ni drugo ne koristimo, a oboje traži native toolchain.
allowBuilds:
  better-sqlite3: false
  esbuild: true
  msgpackr-extract: true
  sharp: false
  workerd: true
